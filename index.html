
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b14">
  <title>LocalPilot AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080b14;
      color: #f4f6ff;
      min-height: 100vh;
    }
    header {
      padding: 18px;
      border-bottom: 1px solid #252b3b;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      background: #080b14;
      z-index: 2;
    }
    .logo {
      width: 44px;
      height: 44px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #7c5cff, #20c7b5);
      font-size: 23px;
    }
    h1 { font-size: 19px; margin: 0 0 4px; }
    .status { color: #69e7b5; font-size: 12px; }
    main {
      max-width: 760px;
      margin: auto;
      padding: 24px 16px 150px;
    }
    .welcome { text-align: center; padding: 36px 8px 25px; }
    .welcome .big { font-size: 44px; }
    .welcome h2 { font-size: 27px; margin: 12px 0 8px; }
    .welcome p { color: #aab2c8; line-height: 1.6; margin: 0; }
    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 12px 0 24px;
    }
    .suggestion {
      color: #e7eaff;
      text-align: left;
      background: #111727;
      border: 1px solid #293149;
      padding: 14px;
      border-radius: 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .suggestion:active { background: #202943; }
    #messages { display: flex; flex-direction: column; gap: 16px; }
    .message {
      max-width: 92%;
      padding: 14px 16px;
      border-radius: 17px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
    }
    .user {
      align-self: flex-end;
      background: #6548e8;
      border-bottom-right-radius: 5px;
    }
    .assistant {
      align-self: flex-start;
      background: #151b2b;
      border: 1px solid #293149;
      border-bottom-left-radius: 5px;
    }
    .error { color: #ffb4b4; }
    .composer-wrap {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(transparent, #080b14 18%);
    }
    .composer {
      max-width: 760px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 9px;
      padding: 9px;
      background: #151b2b;
      border: 1px solid #343d57;
      border-radius: 20px;
    }
    textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      max-height: 130px;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      font: inherit;
      padding: 10px 7px;
    }
    textarea::placeholder { color: #929bb2; }
    #send {
      border: 0;
      border-radius: 14px;
      background: #7958ff;
      color: white;
      font-weight: 700;
      padding: 12px 15px;
      cursor: pointer;
    }
    #send:disabled { opacity: .5; }
    .note {
      max-width: 760px;
      margin: 8px auto 0;
      color: #7e879e;
      font-size: 11px;
      text-align: center;
    }
    @media (max-width: 380px) {
      .suggestions { grid-template-columns: 1fr; }
      .welcome h2 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">✦</div>
    <div>
      <h1>LocalPilot AI</h1>
      <div class="status">● Your AI assistant</div>
    </div>
  </header>

  <main>
    <section class="welcome" id="welcome">
      <div class="big">🤖</div>
      <h2>Hey bro, welcome!</h2>
      <p>Ask anything. Study, coding, ideas, projects — let's build something great.</p>
    </section>

    <section class="suggestions" id="suggestions">
      <button class="suggestion" data-prompt="Teach me Python from the basics with examples.">🐍 Learn Python</button>
      <button class="suggestion" data-prompt="Help me plan a college project step by step.">💡 College project</button>
      <button class="suggestion" data-prompt="Explain this topic in simple Telugu-English.">📚 Explain a topic</button>
      <button class="suggestion" data-prompt="Give me a useful business website idea for beginners.">🚀 Business ideas</button>
    </section>

    <section id="messages" aria-live="polite"></section>
  </main>

  <div class="composer-wrap">
    <form class="composer" id="chatForm">
      <textarea id="messageInput" rows="1" maxlength="8000"
        placeholder="Message LocalPilot AI..." aria-label="Your message"></textarea>
      <button id="send" type="submit">Send ↑</button>
    </form>
    <div class="note">Check important information independently.</div>
  </div>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("send");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const suggestions = document.getElementById("suggestions");

    function addMessage(text, type) {
      const bubble = document.createElement("div");
      bubble.className = "message " + type;
      bubble.textContent = text;
      messages.appendChild(bubble);
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      return bubble;
    }

    async function sendMessage(text) {
      text = text.trim();
      if (!text || sendButton.disabled) return;

      welcome.hidden = true;
      suggestions.hidden = true;
      addMessage(text, "user");
      input.value = "";
      input.style.height = "auto";
      sendButton.disabled = true;
      sendButton.textContent = "...";
      const loading = addMessage("Thinking, bro... ✨", "assistant");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || "AI request failed. Please try again.");
        }
        if (!data.reply) {
          throw new Error("No reply received. Please try again.");
        }

        loading.textContent = data.reply;
      } catch (error) {
        loading.classList.add("error");
        loading.textContent =
          "AI connection issue, bro. " +
          (error.message || "Please try again.") +
          "\n\nCheck that you're using the Vercel website and that the API is configured.";
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "Send ↑";
        input.focus();
      }
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      sendMessage(input.value);
    });

    input.addEventListener("input", function() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 130) + "px";
    });

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.querySelectorAll(".suggestion").forEach(function(button) {
      button.addEventListener("click", function() {
        sendMessage(button.dataset.prompt);
      });
    });
  </script>
</body>
</html>
